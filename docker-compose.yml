services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-nope_ai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6007:6006" # Phoenix UI + OTLP HTTP collector
      - "4318:4317" # OTLP gRPC collector
    volumes:
      - phoenix-data:/mnt/data

  fastapi:
    build: ./fastapi-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:4317
    volumes:
      - ./fastapi-service:/app
      - fastapi-venv:/app/.venv
    depends_on:
      - phoenix
    develop:
      watch:
        - action: sync
          path: ./fastapi-service
          target: /app

  streamlit:
    build: ./streamlit-app
    ports:
      - "8501:8501"
    environment:
      - FASTAPI_URL=http://fastapi:8000
    volumes:
      - ./streamlit-app:/app
      - streamlit-venv:/app/.venv
    depends_on:
      - fastapi

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nope_ai}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - .next/

volumes:
  fastapi-venv:
  streamlit-venv:
  phoenix-data:
  postgres-data:
  frontend-node-modules:
  frontend-next:
