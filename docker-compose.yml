services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6007:6006" # Phoenix UI + OTLP HTTP collector
      - "4318:4317" # OTLP gRPC collector
    volumes:
      - phoenix-data:/mnt/data

  fastapi:
    build: ./fastapi-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:4317
    volumes:
      - ./fastapi-service:/app
      - fastapi-venv:/app/.venv
    depends_on:
      - phoenix
    develop:
      watch:
        - action: sync
          path: ./fastapi-service
          target: /app

  streamlit:
    build: ./streamlit-app
    ports:
      - "8501:8501"
    environment:
      - FASTAPI_URL=http://fastapi:8000
    volumes:
      - ./streamlit-app:/app
      - streamlit-venv:/app/.venv
    depends_on:
      - fastapi

  # Production image (target: runner - see frontend/Dockerfile). Migrations are
  # NOT run automatically; apply them against DATABASE_URL as a separate deploy
  # step before starting this service (`pnpm db:migrate` from ./frontend, or
  # `docker compose build frontend --target migrator` if you add one later).
  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        # Baked into the client bundle at build time - changing it requires a rebuild.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:?POSTGRES_USER must be set in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_started

volumes:
  fastapi-venv:
  streamlit-venv:
  phoenix-data:
  postgres-data:
