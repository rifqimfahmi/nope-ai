services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6007:6006" # Phoenix UI + OTLP HTTP collector
      - "4318:4317" # OTLP gRPC collector
    volumes:
      - phoenix-data:/mnt/data

  fastapi:
    build:
      context: ./fastapi-service
      target: dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:4317
    volumes:
      - ./fastapi-service:/app
      - fastapi-venv:/app/.venv
    depends_on:
      - phoenix
    develop:
      watch:
        - action: sync
          path: ./fastapi-service
          target: /app

  streamlit:
    build: ./streamlit-app
    ports:
      - "8501:8501"
    environment:
      - FASTAPI_URL=http://fastapi:8000
    volumes:
      - ./streamlit-app:/app
      - streamlit-venv:/app/.venv
    depends_on:
      - fastapi

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    environment:
      # Internal upstream, read server-side only (see frontend/src/app/api/challenge-me/route.ts).
      - FASTAPI_URL=http://fastapi:8000
      - DATABASE_URL=postgres://${POSTGRES_USER:?POSTGRES_USER must be set in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      # pnpm's dep-status preflight (runs before every pnpm command) wants to
      # confirm removing a stale node_modules interactively when package.json
      # drifts from the frontend-node-modules volume; there's no TTY under
      # `docker compose up -d`, so it aborts. CI=true is pnpm's own documented
      # bypass for this exact non-interactive case.
      - CI=true
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - .next/

  # Metabase (admin dashboard for querying nope-ai-2's PostgreSQL data)
  # run: docker compose --profile tools up -d metabase
  metabase:
    image: metabase/metabase:latest
    container_name: nope-ai-2_metabase
    restart: unless-stopped
    profiles:
      - tools
    environment:
      # Metabase's own dashboards/questions/users live here (its embedded H2
      # app-db), bind-mounted to ./metabase-data so the file can be copied to
      # another machine directly — separate from nope-ai-2's actual data, which
      # it connects to as an external data source added through the Metabase UI
      # on first login.
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - ./metabase-data:/metabase-data
    ports:
      - "127.0.0.1:3004:3000"
    depends_on:
      - postgres

volumes:
  fastapi-venv:
  streamlit-venv:
  phoenix-data:
  postgres-data:
  frontend-node-modules:
  frontend-next:
