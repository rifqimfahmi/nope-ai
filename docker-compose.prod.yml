# Production overlay. Layers on top of the base docker-compose.yml (dev/local
# stack) rather than replacing it. streamlit has no place in prod, so it's
# simply never named in the `up` command below - it's still defined in the
# base file (for dev), just not started.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     up -d --build frontend fastapi postgres-prod phoenix-prod
#
#   # Metabase is opt-in even in prod (same as dev's `--profile tools`):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --profile tools up -d metabase-prod
#
# postgres-prod, phoenix-prod and metabase-prod are separate services (own
# volumes, own - or no - host ports) so prod data never lives alongside dev's,
# and the two stacks can run side by side on one host without colliding.
# `frontend` and `fastapi` stay as the same service names as the base file -
# only their build target and, where relevant, the hostnames they talk to
# change - since they're stateless and don't need an isolated instance the
# way the data-holding services do.
#
# FASTAPI_URL/DATABASE_URL are not build-time secrets - both are read
# server-side, at request time, by this app's own route handlers
# (src/app/api/). Nothing is exposed to the browser.
#
# Migrations are NOT run automatically - the `runner` target deliberately
# excludes drizzle-kit to stay small. Apply them separately before deploying,
# via the `migrate` service below (builder target, so drizzle-kit is present):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --profile migrate run --rm migrate

services:
  # Base file's dev-only streamlit/postgres/phoenix have no place in prod -
  # gate them behind a profile nothing here activates, so a bare `up -d` on
  # the merged prod config can't accidentally instantiate them (only naming
  # one explicitly, or activating --profile dev-only, would). Their prod
  # counterparts (postgres-prod, phoenix-prod) are unaffected - profiles
  # only apply to the service they're declared on.
  streamlit:
    profiles:
      - dev-only

  postgres:
    profiles:
      - dev-only

  phoenix:
    profiles:
      - dev-only

  postgres-prod:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port mapping - only reachable from other containers on the
    # same Docker network (frontend), unlike dev's `postgres` which exposes
    # 5433 for local psql/GUI access.

  phoenix-prod:
    image: arizephoenix/phoenix:20.2.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6008:6006" # Phoenix UI + OTLP HTTP collector (dev uses 6007) - no auth, keep off the public interface
      - "127.0.0.1:4319:4317" # OTLP gRPC collector (dev uses 4318)
    volumes:
      - phoenix-prod-data:/mnt/data

  fastapi:
    build:
      target: runner
    restart: unless-stopped
    environment:
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix-prod:4317
    # The dev stage's bind mount + venv volume don't apply to the
    # self-contained runner image - clear them instead of running the
    # production container with the host's ./fastapi-service mounted over it.
    volumes: !reset []
    depends_on: !override
      - phoenix-prod

  frontend:
    build:
      target: runner
    restart: unless-stopped
    # Dev's 3000:3000 collides with other apps on this host - prod gets its
    # own free host port instead.
    ports: !override
      - "3008:3000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:?POSTGRES_USER must be set in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres-prod:5432/${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    # The dev stage's bind mount + anti-shadow volumes don't apply to the
    # self-contained runner image - clear them instead of running the
    # production container with the host's ./frontend mounted over it.
    volumes: !reset []
    depends_on: !override
      fastapi:
        condition: service_started
      postgres-prod:
        condition: service_healthy

  # One-off migration runner, built from the `builder` stage (has drizzle-kit,
  # unlike `runner`) so it can apply migrations without bloating the prod
  # image that actually serves traffic. Profile-gated like metabase-prod/newt
  # so it never starts on a bare `up -d` - invoke it explicitly as a deploy
  # step (see top-of-file comment).
  migrate:
    build:
      context: ./frontend
      target: builder
    profiles:
      - migrate
    command: ["pnpm", "db:migrate"]
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:?POSTGRES_USER must be set in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres-prod:5432/${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    depends_on:
      postgres-prod:
        condition: service_healthy

  # Prod's own Metabase, pointed at postgres-prod as its external data source
  # (added through the Metabase UI on first login, same as dev - see the base
  # file's `metabase` service). Kept behind the same `tools` profile as dev.
  metabase-prod:
    image: metabase/metabase:v0.63.13
    container_name: nope-ai-2_metabase_prod
    restart: unless-stopped
    profiles:
      - tools
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - ./metabase-data-prod:/metabase-data
    ports:
      - "127.0.0.1:3005:3000" # dev uses 3004
    depends_on:
      - postgres-prod

  # Pangolin tunnel into this host. Opt-in like metabase-prod - start with
  # `--profile tunnel up -d newt`.
  newt:
    image: fosrl/newt
    container_name: nope-ai-2_newt
    restart: unless-stopped
    profiles:
      - tunnel
    environment:
      - PANGOLIN_ENDPOINT=https://appsto.me
      - NEWT_ID=gx3zj1oi1g1u7gh
      - NEWT_SECRET=${NEWT_SECRET:?NEWT_SECRET required}

  # Restarts the newt container if it drops off Pangolin - watches it via the
  # host's Docker socket, so it can act on `newt` without being in its network.
  newt-monitor:
    image: ghcr.io/rifqimfahmi/newt-monitor:1.0.3
    restart: unless-stopped
    profiles:
      - tunnel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MONITOR_URL=${MONITOR_URL:?MONITOR_URL env is required}
      - CONTAINER_NAME=nope-ai-2_newt
      - CHECK_INTERVAL=30
      - LOG_LEVEL=INFO
    depends_on:
      - newt

volumes:
  postgres-prod-data:
  phoenix-prod-data:
